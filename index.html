<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#102840">
  <title>رحلة الهمزتين | الصف الخامس</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap');
    :root{--navy:#102840;--ink:#17364a;--muted:#567083;--teal:#00aaab;--cyan:#d7f8f5;--gold:#ffba4b;--coral:#f57f69;--paper:#fffdf6;--line:#dbe8ea;--good:#13835e;--bad:#b54842}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;background:radial-gradient(circle at 10% 10%,#306382 0,transparent 28%),radial-gradient(circle at 90% 80%,#1b777b 0,transparent 35%),#102840;color:var(--ink);font-family:Cairo,Tahoma,Arial,sans-serif;font-size:16px}
    button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:4px solid #f5bd51;outline-offset:3px}button:disabled{cursor:default}
    .shell{max-width:1200px;margin:auto;padding:18px clamp(14px,3vw,34px) 30px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;color:white;margin-bottom:17px}.brand{display:flex;align-items:center;gap:11px;font-weight:900;font-size:clamp(18px,2.2vw,25px)}.brandmark{display:grid;place-items:center;width:44px;height:44px;border-radius:15px;background:var(--gold);color:var(--navy);font-size:27px;box-shadow:0 5px 0 #d48f24}.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.topbtn{border:1px solid #8cc5ca88;border-radius:12px;background:#ffffff12;color:white;padding:8px 12px;font-weight:800}.topbtn:hover{background:#ffffff25}
    .game{background:var(--paper);border-radius:28px;box-shadow:0 22px 0 #092236,0 30px 60px #00182766;overflow:hidden;min-height:680px;position:relative}.game:before{content:"";position:absolute;inset:0 0 auto;height:8px;background:linear-gradient(90deg,var(--coral),var(--gold),var(--teal));z-index:2}
    .hero{padding:clamp(25px,5vw,50px);display:grid;grid-template-columns:1.2fr .8fr;gap:24px;align-items:center;min-height:580px;background:radial-gradient(circle at 18% 80%,#e3f5ef 0,transparent 35%),radial-gradient(circle at 80% 15%,#fff2cf 0,transparent 36%)}.eyebrow{display:inline-block;background:#e9f5f1;color:#00797e;border-radius:100px;padding:5px 15px;font-size:14px;font-weight:900}.hero h1{font-size:clamp(36px,5.6vw,72px);line-height:1.35;margin:15px 0;color:var(--navy);letter-spacing:-1px}.hero h1 em{font-style:normal;color:#008e98}.lead{color:var(--muted);font-size:clamp(17px,2vw,22px);font-weight:700;line-height:1.9;max-width:660px}.pillrow{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 24px}.pill{background:white;border:1px solid var(--line);padding:6px 12px;border-radius:100px;font-weight:800;color:#365a68}.primary{border:0;border-radius:17px;background:var(--gold);color:#273948;padding:14px 27px;font-size:20px;font-weight:900;box-shadow:0 6px 0 #d89932;min-height:54px}.primary:hover{transform:translateY(-2px)}.primary:active{transform:translateY(4px);box-shadow:0 2px 0 #d89932}.primary:disabled{opacity:.55;transform:none;box-shadow:none}.secondary{background:#e5f5f2;box-shadow:0 5px 0 #a8d7d1;color:#176067}.signature{font-weight:900;color:#477484;font-size:14px;margin-top:28px}.art{height:355px;position:relative;display:grid;place-items:center}.orb{height:290px;width:290px;border-radius:50%;background:#e6f7f3;position:absolute;box-shadow:inset 0 0 0 24px #d5f0e9}.cardletter{position:absolute;width:175px;height:190px;background:white;border-radius:24px;box-shadow:0 12px 0 #aed9d3,0 23px 35px #123a5333;display:grid;place-items:center;font-family:Tahoma,Arial,sans-serif;font-size:115px;font-weight:bold}.letter1{right:13%;transform:rotate(12deg);color:var(--teal)}.letter2{left:13%;transform:rotate(-12deg);color:var(--coral)}.spark{position:absolute;font-size:44px;z-index:1;color:var(--gold)}.spark.one{top:0;left:10%}.spark.two{bottom:0;right:9%}
    .play{padding:clamp(18px,3vw,34px);background:linear-gradient(#fffdf8,#f8fbf8);min-height:650px}.hud{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}.roundtag{display:flex;gap:10px;align-items:center;font-weight:900;color:#087b82}.roundnumber{display:grid;place-items:center;width:43px;height:43px;border-radius:13px;background:var(--teal);color:white}.score{background:#fff1d3;border-radius:100px;padding:7px 16px;font-weight:900;color:#78500e}.track{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:20px 0 24px}.station{border-radius:12px;padding:8px;text-align:center;background:#edf3f1;color:#68818a;font-size:13px;font-weight:900}.station.done{background:#dbf5e6;color:var(--good)}.station.now{background:#d4f2f1;color:#007c83;box-shadow:inset 0 0 0 2px #69c9c4}.meter{height:12px;border-radius:100px;background:#e6eeee;overflow:hidden;margin-bottom:14px}.meterfill{height:100%;width:0;background:linear-gradient(90deg,var(--teal),#8cdbb6);transition:width .35s}.smallmeta{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;font-weight:800}.questionbox{max-width:900px;margin:20px auto;background:white;border:1px solid #e5eded;border-radius:26px;padding:clamp(20px,3vw,34px);box-shadow:0 10px 30px #1030470b}.label{font-size:13px;font-weight:900;color:#04898b;letter-spacing:.5px}.prompt{font-size:clamp(21px,2.8vw,32px);line-height:1.8;color:var(--navy);font-weight:900;margin:12px 0 19px}.context{background:#f3f8f7;border-right:5px solid var(--teal);border-radius:13px;padding:14px 18px;font-size:clamp(17px,2vw,22px);line-height:2;font-weight:700;margin:0 0 22px}.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.option{min-height:76px;border:2px solid #dce9e9;border-radius:17px;background:#fff;text-align:right;padding:12px 19px;color:#193d4d;font-weight:800;font-size:clamp(17px,1.8vw,22px);display:flex;align-items:center;gap:14px;line-height:1.5}.option:hover:not(:disabled){border-color:var(--teal);background:#f3fbfa;transform:translateY(-2px)}.option .key{flex:0 0 32px;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:#ecf4f4;color:#3d7880;font-size:15px}.option.correct{border-color:#23a779;background:#e9f9ef;color:#166746}.option.wrong{border-color:#ef7d77;background:#fff0ed;color:#a83530}.option.dim{opacity:.58}.feedback{margin-top:17px;border-radius:16px;padding:14px 17px;line-height:1.8;font-weight:800;display:none}.feedback.good{display:block;background:#e4f8ee;color:#176d4b}.feedback.bad{display:block;background:#fff0e9;color:#963c32}.feedback strong{display:block;font-size:20px}.questionfoot{display:flex;justify-content:flex-end;margin-top:18px}.hint{text-align:center;color:#667f88;font-size:13px;font-weight:700;margin:14px}
    .end{padding:clamp(25px,5vw,50px);text-align:center;min-height:580px;background:radial-gradient(circle at 50% 12%,#e6faf2,transparent 42%)}.medal{font-size:70px;line-height:1}.end h2{font-size:clamp(28px,4vw,47px);color:var(--navy);margin:15px 0 5px}.endlead{color:var(--muted);font-size:19px;font-weight:700}.bigscore{display:inline-flex;align-items:baseline;gap:5px;margin:14px 0;font-size:53px;font-weight:900;color:#00868e}.bigscore small{font-size:23px;color:#6f8991}.report{max-width:740px;display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:20px auto}.reportitem{background:white;border:1px solid var(--line);border-radius:16px;padding:11px;display:flex;justify-content:space-between;gap:10px;font-weight:800}.review{max-width:740px;margin:18px auto;text-align:right;background:#fff3e8;border-radius:16px;padding:15px 20px}.review h3{margin:0 0 5px}.review ul{margin:5px 0;padding-right:25px;line-height:1.8}.endbuttons{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:24px}.foot{text-align:center;color:#c2dce0;font-size:13px;font-weight:800;margin:27px 0 0}
    @media(max-width:750px){.hero{grid-template-columns:1fr;min-height:0}.art{height:240px;grid-row:1}.orb{width:200px;height:200px}.cardletter{width:120px;height:135px;font-size:80px}.letter1{right:25%}.letter2{left:25%}.hero h1{font-size:42px}.options{grid-template-columns:1fr}.track{grid-template-columns:repeat(2,1fr)}.report{grid-template-columns:1fr}.topbar{align-items:flex-start}.brand{font-size:17px}.topbtn{font-size:13px;padding:7px}.game{border-radius:18px}.option{min-height:66px}}
    @media(max-width:480px){.shell{padding:10px 9px 25px}.topbar{gap:7px}.brandmark{width:35px;height:35px;font-size:21px}.actions{gap:4px}.topbtn{padding:5px 7px}.hero{padding:24px}.art{height:200px}.orb{width:165px;height:165px}.cardletter{width:105px;height:115px;font-size:65px}.lead{font-size:17px}.station{font-size:11px;padding:7px 4px}.play{padding:15px}.questionbox{padding:17px}.questionfoot .primary{width:100%}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand"><span class="brandmark" aria-hidden="true">أ</span><span>مغامرة الهمزتين</span></div>
      <div class="actions"><button class="topbtn" id="soundBtn" type="button" aria-pressed="false">🔇 الصوت</button><button class="topbtn" id="fullBtn" type="button">⛶ ملء الشاشة</button><button class="topbtn" id="homeBtn" type="button" hidden>↻ من البداية</button></div>
    </header>
    <div class="game" id="app" aria-live="polite"></div>
    <footer class="foot">اللغة العربية · الصف الخامس الأساسي · إعداد الأستاذ خليل البلوشي</footer>
  </main>
  <script>
  'use strict';
  const rounds=[
    {name:'بوابة التمييز',skill:'حدّد نوع الهمزة في بداية الكلمة',items:[
      {p:'ما نوع الهمزة في «اكْتِشاف»؟',o:['همزة وصل','همزة قطع'],a:0,e:'تُكتب ألفًا بلا همزة، وتُنطق عند البدء بها.'},
      {p:'ما نوع الهمزة في «إِنَّ»؟',o:['همزة وصل','همزة قطع'],a:1,e:'همزتها مرسومة تحت الألف، وتُنطق في أول الكلام ووصله.'},
      {p:'ما نوع الهمزة في «أَنْقَذَ»؟',o:['همزة وصل','همزة قطع'],a:1,e:'همزة القطع تظهر فوق الألف في أول الكلمة.'},
      {p:'ما نوع الهمزة في «الْمُحاوَلات»؟',o:['همزة وصل','همزة قطع'],a:0,e:'الألف في «الـ» همزة وصل.'},
      {p:'ما نوع الهمزة في «أُولى»؟',o:['همزة وصل','همزة قطع'],a:1,e:'كلمة «أولى» تبدأ بهمزة قطع فوق الألف.'},
      {p:'ما نوع الهمزة في «ابْن»؟',o:['همزة وصل','همزة قطع'],a:0,e:'تبدأ «ابن» بهمزة وصل، وتُكتب دون علامة همزة.'}
    ]},
    {name:'ورشة الكتابة',skill:'اختر الرسم الصحيح للكلمة',items:[
      {p:'اختر الكتابة الصحيحة:',o:['إكتشاف','أكتشاف','اكتشاف'],a:2,e:'تبدأ «اكتشاف» بهمزة وصل؛ لذا تُكتب ألفًا بلا همزة.'},
      {p:'اختر الكتابة الصحيحة:',o:['إستمع','استمع','أستمع'],a:1,e:'تبدأ «استمع» بهمزة وصل.'},
      {p:'اختر الكتابة الصحيحة:',o:['انقذ','إنقذ','أنقذ'],a:2,e:'همزة «أنقذ» قطع مفتوحة؛ فتُكتب فوق الألف.'},
      {p:'اختر الكتابة الصحيحة:',o:['احسان','أحسان','إحسان'],a:2,e:'همزة «إحسان» قطع مكسورة؛ فتُكتب تحت الألف.'},
      {p:'اختر الكتابة الصحيحة:',o:['الإمام','الامام','الأمام'],a:0,e:'في «الإمام» أل التعريف بهمزة وصل، وهمزة «إمام» قطع.'},
      {p:'اختر الكتابة الصحيحة:',o:['اسم','إسم','أسم'],a:0,e:'كلمة «اسم» تبدأ بهمزة وصل.'}
    ]},
    {name:'مدينة الجمل',skill:'طبّق القاعدة داخل الجملة',items:[
      {p:'أكمل الجملة بالكلمة الصحيحة:',c:'…… الطالبُ إلى نصيحة معلمه.',o:['استمع','إستمع','أستمع'],a:0,e:'الصحيح «استمع»؛ همزتها همزة وصل.'},
      {p:'أكمل الجملة بالكلمة الصحيحة:',c:'…… الطبيبُ حياةَ المصاب.',o:['انقذ','أنقذ','إنقذ'],a:1,e:'الصحيح «أنقذ»؛ همزتها قطع مفتوحة.'},
      {p:'أي كلمة في الجملة تبدأ بهمزة وصل؟',c:'إنَّ أحمدَ يحبُّ المدرسةَ.',o:['إنَّ','أحمد','المدرسة'],a:2,e:'«المدرسة» تبدأ بأل التعريف، وهمزتها وصل.'},
      {p:'أي كلمة في الجملة تبدأ بهمزة قطع؟',c:'استعار ابنُ خالدٍ كتابًا من المكتبة.',o:['استعار','ابن','المكتبة','لا توجد كلمة'],a:3,e:'الكلمات الثلاث المبدوءة بألف هنا تبدأ بهمزة وصل.'},
      {p:'أكمل الجملة بالكلمة الصحيحة:',c:'…… الطالبُ في كتابة الواجب.',o:['اجتهد','إجتهد','أجتهد'],a:0,e:'الصحيح «اجتهد»؛ همزتها همزة وصل.'},
      {p:'أي كلمة في الجملة تبدأ بهمزة قطع؟',c:'انطلق أحمدُ إلى المدرسة.',o:['انطلق','أحمد','المدرسة'],a:1,e:'همزة «أحمد» قطع، أما «انطلق» و«المدرسة» فتبدآن بهمزة وصل.'}
    ]},
    {name:'تحدّي الاختبار',skill:'استخراج وتصويب وتفسير',items:[
      {p:'استخرج كلمة تبدأ بهمزة قطع:',c:'استيقظ أمينٌ مبكرًا وانطلق إلى المدرسة.',o:['استيقظ','أمين','انطلق','المدرسة'],a:1,e:'«أمين» تبدأ بهمزة قطع. وتبدأ «إلى» كذلك بهمزة قطع، لكنها ليست ضمن البدائل.'},
      {p:'أي كلمة كُتبت همزتها كتابة غير صحيحة؟',o:['أحسن','إنتشر','الإمام','استمع'],a:1,e:'الصواب «انتشر» بهمزة وصل.'},
      {p:'صحّح الكلمة المخطوءة في الجملة:',c:'إكتشفَ الطالبُ معلومةً جديدةً.',o:['اكتشف','أكتشف','إكتشف'],a:0,e:'الصواب «اكتشف» بهمزة وصل.'},
      {p:'ما سبب كتابة الهمزة تحت الألف في «إِبْرَة»؟',o:['لأنها همزة وصل','لأنها همزة قطع مكسورة','لأنها همزة قطع مفتوحة'],a:1,e:'تُرسم همزة القطع تحت الألف إذا كانت مكسورة.'},
      {p:'عند وصل «استمع» بما قبلها في الكلام، ماذا يحدث لهمزة الوصل؟',o:['تُنطق دائمًا','لا تُنطق','تصبح همزة قطع'],a:1,e:'تُنطق همزة الوصل عند البدء بالكلمة، ولا تُنطق في وصل الكلام.'},
      {p:'أي مجموعة تبدأ جميع كلماتها بهمزة قطع؟',o:['ابن، اسم، المدرسة','إنَّ، أحمد، أُولى','استمع، أنقذ، الإمام'],a:1,e:'تبدأ «إنَّ» و«أحمد» و«أولى» جميعها بهمزة قطع.'}
    ]}
  ];
  const app=document.getElementById('app'),homeBtn=document.getElementById('homeBtn'),soundBtn=document.getElementById('soundBtn');
  const total=rounds.reduce((n,r)=>n+r.items.length,0);
  let state={screen:'home',round:0,index:0,answered:false,score:0,roundScores:rounds.map(()=>0),misses:[]};
  let sound=false,audio;
  function beep(success){if(!sound)return;try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();let osc=audio.createOscillator(),gain=audio.createGain();osc.connect(gain);gain.connect(audio.destination);osc.type='sine';osc.frequency.setValueAtTime(success?660:260,audio.currentTime);osc.frequency.exponentialRampToValueAtTime(success?880:200,audio.currentTime+.14);gain.gain.setValueAtTime(.06,audio.currentTime);gain.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.2);osc.start();osc.stop(audio.currentTime+.21)}catch(_){}}
  function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  function setScreen(s){state.screen=s;homeBtn.hidden=s==='home';render();window.scrollTo({top:0,behavior:'smooth'})}
  function render(){if(state.screen==='home')renderHome();else if(state.screen==='play')renderPlay();else renderEnd()}
  function renderHome(){app.innerHTML=`<section class="hero"><div><span class="eyebrow">لعبة تفاعلية · لغتي الجميلة · الصف الخامس</span><h1>رحلة <em>همزتي</em><br>الوصل والقطع</h1><p class="lead">أربع محطات ممتعة: ميّز الهمزة، اختر الكتابة الصحيحة، أكمل الجمل، ثم اجتز تحدّي الاختبار.</p><div class="pillrow"><span class="pill">٤ جولات</span><span class="pill">٢٤ سؤالًا</span><span class="pill">تفسير فوري</span><span class="pill">تعمل دون اتصال</span></div><button class="primary" id="startBtn" type="button">ابدأ المغامرة ←</button><p class="signature">إعداد الأستاذ خليل البلوشي</p></div><div class="art" aria-hidden="true"><div class="orb"></div><span class="spark one">✦</span><div class="cardletter letter1">ا</div><div class="cardletter letter2">أ</div><span class="spark two">✧</span></div></section>`;document.getElementById('startBtn').onclick=restart}
  function renderPlay(){let r=rounds[state.round],q=r.items[state.index],answeredCount=rounds.slice(0,state.round).reduce((n,x)=>n+x.items.length,0)+state.index;
    app.innerHTML=`<section class="play"><div class="hud"><div class="roundtag"><span class="roundnumber">${state.round+1}</span><span>${r.name}<br><small>${r.skill}</small></span></div><div class="score">★ ${state.score} نقطة</div></div><div class="track">${rounds.map((x,i)=>`<div class="station ${i<state.round?'done':i===state.round?'now':''}">${i<state.round?'✓ ':''}${escapeHTML(x.name)}</div>`).join('')}</div><div class="meter" role="progressbar" aria-label="تقدّم اللعبة" aria-valuenow="${answeredCount}" aria-valuemin="0" aria-valuemax="${total}"><div class="meterfill" style="width:${answeredCount/total*100}%"></div></div><div class="smallmeta"><span>السؤال ${state.index+1} من ${r.items.length}</span><span>أكملت ${answeredCount} من ${total}</span></div><div class="questionbox"><div class="label">المحطة ${state.round+1} · السؤال ${state.index+1}</div><h2 class="prompt" id="prompt">${escapeHTML(q.p)}</h2>${q.c?`<div class="context">${escapeHTML(q.c)}</div>`:''}<div class="options" role="group" aria-labelledby="prompt">${q.o.map((v,i)=>`<button type="button" class="option" data-answer="${i}"><span class="key">${i+1}</span><span>${escapeHTML(v)}</span></button>`).join('')}</div><div id="feedback" class="feedback" role="status"></div><div class="questionfoot"><button class="primary" id="nextBtn" type="button" hidden>السؤال التالي ←</button></div></div><div class="hint">اختر إجابة واحدة، ثم اقرأ التفسير لتثبيت القاعدة.</div></section>`;
    app.querySelectorAll('[data-answer]').forEach(b=>b.addEventListener('click',()=>answer(Number(b.dataset.answer))));document.getElementById('nextBtn').onclick=next;
  }
  function answer(choice){if(state.answered)return;let q=rounds[state.round].items[state.index],ok=choice===q.a;state.answered=true;if(ok){state.score++;state.roundScores[state.round]++}else state.misses.push({round:state.round,question:q.p,answer:q.o[q.a]});beep(ok);
    app.querySelectorAll('[data-answer]').forEach(b=>{let i=Number(b.dataset.answer);b.disabled=true;b.classList.add(i===q.a?'correct':i===choice?'wrong':'dim')});let feedback=document.getElementById('feedback');feedback.className='feedback '+(ok?'good':'bad');feedback.innerHTML=`<strong>${ok?'أحسنت! إجابة صحيحة ★':'اقتربت! الإجابة: '+escapeHTML(q.o[q.a])}</strong>${escapeHTML(q.e)}`;let nextBtn=document.getElementById('nextBtn');nextBtn.hidden=false;nextBtn.textContent=state.round===rounds.length-1&&state.index===qLastIndex()?'شاهد نتيجتك ←':state.index===qLastIndex()?'المحطة التالية ←':'السؤال التالي ←';nextBtn.focus({preventScroll:true});
  }
  function qLastIndex(){return rounds[state.round].items.length-1}
  function next(){if(!state.answered)return;state.answered=false;if(state.index<qLastIndex()){state.index++;renderPlay()}else if(state.round<rounds.length-1){state.round++;state.index=0;renderPlay()}else setScreen('end')}
  function renderEnd(){const pct=Math.round(state.score/total*100),headline=pct>=85?'بطل الهمزتين!':pct>=60?'أحسنت التقدم!':'كل محاولة تقرّبك من الإتقان';app.innerHTML=`<section class="end"><div class="medal" aria-hidden="true">${pct>=85?'🏆':pct>=60?'🌟':'📚'}</div><h2>${headline}</h2><p class="endlead">أنهيت جولات همزتي الوصل والقطع.</p><div class="bigscore">${state.score}<small> / ${total} نقطة</small></div><div class="report">${rounds.map((r,i)=>`<div class="reportitem"><span>${escapeHTML(r.name)}</span><span>${state.roundScores[i]} / ${r.items.length}</span></div>`).join('')}</div>${state.misses.length?`<div class="review"><h3>راجع هذه الكلمات والأسئلة:</h3><ul>${state.misses.slice(0,8).map(m=>`<li>${escapeHTML(m.question)} <strong>← ${escapeHTML(m.answer)}</strong></li>`).join('')}</ul>${state.misses.length>8?`<p>وهناك ${state.misses.length-8} إجابات أخرى يمكنك مراجعتها بإعادة المحاولة.</p>`:''}</div>`:`<p class="endlead">إجاباتك كلها صحيحة، رائع!</p>`}<div class="endbuttons"><button class="primary" id="againBtn" type="button">ألعب مرة أخرى ↻</button><button class="primary secondary" id="homeEndBtn" type="button">الصفحة الرئيسة</button></div><p class="signature">إعداد الأستاذ خليل البلوشي</p></section>`;document.getElementById('againBtn').onclick=restart;document.getElementById('homeEndBtn').onclick=()=>setScreen('home')}
  function restart(){state={screen:'play',round:0,index:0,answered:false,score:0,roundScores:rounds.map(()=>0),misses:[]};setScreen('play')}
  homeBtn.onclick=()=>setScreen('home');soundBtn.onclick=()=>{sound=!sound;soundBtn.textContent=sound?'🔊 الصوت':'🔇 الصوت';soundBtn.setAttribute('aria-pressed',String(sound));if(sound)beep(true)};
  document.getElementById('fullBtn').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(_){}};
  document.addEventListener('keydown',e=>{if(state.screen!=='play'||e.altKey||e.ctrlKey||e.metaKey||/INPUT|TEXTAREA/.test(document.activeElement.tagName))return;let q=rounds[state.round].items[state.index];if(!state.answered&&/^[1-4]$/.test(e.key)&&Number(e.key)<=q.o.length)answer(Number(e.key)-1);else if(state.answered&&e.key==='Enter')next()});
  render();
  </script>
</body>
</html>
